name: Tintmap
options:
  bundleIdPrefix: de.markusfreise
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 752F6BF2SD
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Tintmap:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - Resources/Assets.xcassets
      # What the app collects (nothing), for the App Store.
      - Resources/PrivacyInfo.xcprivacy
      # Paint stock, colour chart and sample photos, exported from the web app's data (npm run app:data).
      - path: Resources/Data
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.markusfreise.tintmap
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # The analysis is number crunching; without optimisation a debug build takes seconds per picture.
        SWIFT_OPTIMIZATION_LEVEL: -O
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Tintmap-macOS.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Tintmap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No own encryption: no export compliance questions on upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.graphics-design
        NSCameraUsageDescription: Take a photo to find its colours and the mixes for them.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  TintmapTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
    dependencies:
      - target: Tintmap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.markusfreise.tintmap.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        # The executable sits deeper in a Mac app bundle than in an iOS one.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tintmap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tintmap
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Tintmap:
    build:
      targets:
        Tintmap: all
        TintmapTests: [test]
    test:
      targets:
        - TintmapTests
    run:
      # Local purchases without App Store Connect.
      storeKitConfiguration: Tintmap.storekit
