<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="#3a3530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
  <!-- Shot reference, hand-drawn: the app empty, a photo being chosen from the device. -->
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="18" fill="#fbf8f2" stroke="none"/>
  <g filter="url(#rough)">
    <!-- app window -->
    <rect x="30" y="28" width="540" height="344" rx="14"/>
    <path d="M30 70 H570"/>
    <circle cx="56" cy="49" r="6"/><circle cx="76" cy="49" r="6"/><circle cx="96" cy="49" r="6"/>
    <!-- left tool column, "New" highlighted -->
    <rect x="48" y="90" width="38" height="38" rx="8" fill="#9ec5e8"/>
    <path d="M58 116 l9 -12 l6 7 l5 -5 l7 10 z" stroke-width="2.5"/>
    <rect x="48" y="138" width="38" height="38" rx="8"/>
    <rect x="48" y="186" width="38" height="38" rx="8"/>
    <!-- the photo being picked: mountains, lake, sun -->
    <rect x="200" y="110" width="250" height="170" rx="6" fill="#fff"/>
    <path d="M200 238 L262 168 L300 210 L345 150 L450 250" />
    <path d="M200 252 C260 240 330 262 450 246 L450 280 L200 280 Z" fill="#bfe0f2"/>
    <circle cx="405" cy="148" r="17" fill="#fae98a"/>
    <!-- cursor dragging it in -->
    <path d="M470 300 l0 44 l11 -11 l9 20 l9 -4 l-9 -20 l15 0 z" fill="#fff" stroke-width="2.5"/>
    <path d="M470 292 C455 270 450 268 452 286" stroke-dasharray="6 7"/>
  </g>
  <text x="120" y="325" font-size="25" fill="#3a3530" stroke="none">your photo, from the device or camera</text>
</svg>
