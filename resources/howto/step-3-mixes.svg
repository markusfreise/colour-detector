<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="#3a3530" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
  <!-- Shot reference, hand-drawn: the photo as numbered areas, the recipe of one area next to the pointer. -->
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="15"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  </defs>
  <rect x="0" y="0" width="600" height="400" rx="18" fill="#fbf8f2" stroke="none"/>
  <g filter="url(#rough)">
    <rect x="30" y="28" width="540" height="344" rx="14"/>
    <!-- numbered areas: sky, mountains, lake, meadow -->
    <path d="M30 60 Q30 28 62 28 H538 Q570 28 570 60 V170 C470 150 400 120 330 160 C270 120 180 110 30 170 Z" fill="#cfe7f6"/>
    <path d="M30 170 C180 110 270 120 330 160 C400 120 470 150 570 170 V230 H30 Z" fill="#b9a7d8"/>
    <path d="M30 230 H570 V270 C430 290 220 262 30 282 Z" fill="#9ccfee"/>
    <path d="M30 282 C220 262 430 290 570 270 V340 Q570 372 538 372 H62 Q30 372 30 340 Z" fill="#f4d98c"/>
    <!-- the recipe card at the pointer -->
    <rect x="330" y="200" width="210" height="112" rx="10" fill="#fff"/>
    <rect x="348" y="218" width="22" height="22" rx="4" fill="#b9a7d8"/>
    <rect x="348" y="254" width="96" height="16" rx="3" fill="#f2a6cb"/>
    <rect x="444" y="254" width="78" height="16" rx="3" fill="#9ccfee"/>
    <path d="M306 186 l0 40 l10 -10 l8 18 l8 -4 l-8 -18 l14 0 z" fill="#fff" stroke-width="2.5"/>
  </g>
  <g font-size="22" fill="#3a3530" stroke="none">
    <text x="90" y="92">1W</text><text x="120" y="208">2M</text><text x="460" y="198">2C</text>
    <text x="150" y="262">3L</text><text x="110" y="330">4M</text><text x="250" y="342">4R</text>
    <text x="380" y="236" font-size="20">Colour 2M</text>
    <text x="348" y="296" font-size="17">1 x 377  +  1 x 466</text>
